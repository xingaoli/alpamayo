defaults:
  - sft_base
  - /models/ar1_base@model
  - _self_

trainer:
  lr_multiplier:
    vlm.model.visual: 0.1
  ddp_find_unused_parameters: false
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  warmup_steps: 500
  per_device_train_batch_size: 8
  dataloader_num_workers: 16
  save_total_limit: 2
  num_train_epochs: 1
  save_steps: 3000
paths:
  output_dir: output_stage1
evaluate:
  eval_ckpt: null
