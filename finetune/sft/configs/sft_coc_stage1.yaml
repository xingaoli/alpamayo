defaults:
  - sft_coc_base
  - /models/ar1_base@model
  - _self_

trainer:
  lr_multiplier:
    vlm.model.visual: 0.1
  ddp_find_unused_parameters: false
  learning_rate: 1e-5
  warmup_steps: 500
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  dataloader_num_workers: 8
  save_total_limit: 3
  num_train_epochs: 3
  save_steps: 10
paths:
  output_dir: outputs/output_coc_stage1
evaluate:
  eval_ckpt: null
